name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- TypeScript package ---
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install
      - run: npm run lint:ts
      - run: npm test
      - run: npm --workspace @invisra/open-business-plan pack --dry-run

      # --- Python package ---
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/python[test]" ruff mypy
      - run: npm run lint:python
      - run: npm run test:python

      # --- Python package build check ---
      - run: python -m pip install build twine
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
