[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-business-plan"
version = "1.0.0"
description = "Pydantic models that parse and validate the open-business-plan JSON Schema."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Invisra" }]
keywords = ["business-plan", "json-schema", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/invisra/open-business-plan"
Repository = "https://github.com/invisra/open-business-plan"

[project.scripts]
parse-business-plan = "open_business_plan.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["open_business_plan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["open_business_plan"]
mypy_path = "."
ignore_missing_imports = true
